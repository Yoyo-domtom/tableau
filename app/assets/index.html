<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tableau</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<main id="view" class="wrap" tabindex="-1"></main>

<button id="fab" class="fab" type="button" data-act="fab" aria-label="Ajouter" hidden></button>
<div id="dock" class="dock" hidden></div>

<nav class="tabbar" aria-label="Navigation principale">
  <div class="tabbar-in">
    <span class="tab-pill" aria-hidden="true"></span>
    <button class="tab" type="button" data-tab="accueil"><span class="tab-ico" data-icon="tableau"></span><span>Accueil</span></button>
    <button class="tab" type="button" data-tab="planning"><span class="tab-ico" data-icon="agenda"></span><span>Planning</span></button>
    <button class="tab" type="button" data-tab="fichiers"><span class="tab-ico" data-icon="trombone"></span><span>Fichiers</span></button>
    <button class="tab" type="button" data-tab="claude"><span class="tab-ico" data-icon="claude"></span><span>Claude</span><b class="tab-badge" id="claude-badge" hidden></b></button>
  </div>
</nav>

<div id="sheet" class="sheet-wrap" hidden><div class="sheet" id="sheet-in" role="dialog" aria-modal="true"></div></div>
<div id="viewer" class="viewer" role="dialog" aria-modal="true" hidden></div>
<div id="toast" class="toast" hidden><div class="toast-in" role="status" aria-live="polite"><span id="toast-msg"></span><button type="button" id="toast-act" class="toast-act" hidden></button></div></div>

<script src="seed.js"></script>
<script src="pack.js"></script>
<script src="js/base.js"></script>
<script src="js/donnees.js"></script>
<script src="js/propositions.js"></script>
<script src="js/maj.js"></script>
<script src="js/vues.js"></script>
<script src="js/planning.js"></script>
<script src="js/feuilles.js"></script>
<script src="js/app.js"></script>
</body>
</html>
